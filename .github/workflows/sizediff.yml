name: Binary size difference

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  sizediff:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # Prepare, install tools
      - name: Add GOBIN to $PATH
        run: |
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # fetch all history (no sparse checkout)
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cache Go
        uses: actions/cache@v5
        with:
          key: go-cache-linux-sizediff-v2-${{ hashFiles('go.mod') }}
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
      - name: Download drivers repo
        run: git clone https://github.com/tinygo-org/drivers.git
      - name: Save PR configuration
        id: pr
        run: echo "base_sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      # Compute sizes for the PR branch
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: tinygo${{ inputs.version }}.linux-amd64.tar.gz
          path: ${{ runner.temp }}/tinygo-pr-artifact
      - name: Extract release tarball
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/tinygo-pr"
          tar -C "$RUNNER_TEMP/tinygo-pr" -xf "$RUNNER_TEMP/tinygo-pr-artifact/tinygo$VERSION.linux-amd64.tar.gz"
          echo "$RUNNER_TEMP/tinygo-pr/tinygo/bin" >> "$GITHUB_PATH"
          echo "TINYGOROOT=$RUNNER_TEMP/tinygo-pr/tinygo" >> "$GITHUB_ENV"
      - name: Determine binary sizes on the PR branch
        run: |
          set -o pipefail
          (cd drivers; make smoke-test | tee sizes-pr.txt)
          test -s drivers/sizes-pr.txt

      # Compute sizes for the dev branch
      - name: Restore dev sizes
        id: base-cache
        uses: ./.github/actions/sizediff-cache
        with:
          base-sha: ${{ steps.pr.outputs.base_sha }}
      - name: Checkout dev branch
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: git checkout "$BASE_SHA"
      - name: Find dev release artifact
        id: dev-release
        if: steps.base-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          runs="$(gh api --method GET "repos/$BASE_REPOSITORY/actions/workflows/linux.yml/runs" \
            -f event=push -f branch=dev -f head_sha="$BASE_SHA" -f per_page=100 \
            --jq '.workflow_runs[].id')"
          artifact=""
          for run_id in $runs; do
            artifact="$(gh api "repos/$BASE_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '[.artifacts[] | select(.expired == false and (.name | test("^tinygo[0-9].*\\.linux-amd64\\.tar\\.gz$")))] |
                if length > 1 then error("Multiple Linux release artifacts") else .[].name end')"
            if [ -n "$artifact" ]; then
              echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
              echo "artifact-name=$artifact" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          if [ -z "$artifact" ]; then
            echo "::warning::No Linux release artifact for dev commit $BASE_SHA, skipping size comparison"
          fi
      - name: Download dev release artifact
        if: steps.dev-release.outputs.artifact-name != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.dev-release.outputs.run-id }}
          name: ${{ steps.dev-release.outputs.artifact-name }}
          path: ${{ runner.temp }}/tinygo-base-artifact
      - name: Extract dev release tarball
        if: steps.dev-release.outputs.artifact-name != ''
        env:
          ARTIFACT_NAME: ${{ steps.dev-release.outputs.artifact-name }}
        run: |
          mkdir -p "$RUNNER_TEMP/tinygo-base"
          tar -C "$RUNNER_TEMP/tinygo-base" -xf "$RUNNER_TEMP/tinygo-base-artifact/$ARTIFACT_NAME"
          echo "$RUNNER_TEMP/tinygo-base/tinygo/bin" >> "$GITHUB_PATH"
          echo "TINYGOROOT=$RUNNER_TEMP/tinygo-base/tinygo" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/go-build-base" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache-base" >> "$GITHUB_ENV"
      - name: Determine binary sizes on the dev branch
        if: steps.dev-release.outputs.artifact-name != ''
        run: |
          set -o pipefail
          (cd drivers; make smoke-test | tee sizes-dev.txt)
          test -s drivers/sizes-dev.txt

      # Create comment
      # TODO: add a summary, something like:
      #  - overall size difference (percent)
      #  - number of binaries that grew / shrank / remained the same
      #  - don't show the full diff when no binaries changed
      - name: Calculate size diff
        id: diff
        if: hashFiles('drivers/sizes-dev.txt') != ''
        run: |
          set -o pipefail
          ./tools/sizediff drivers/sizes-dev.txt drivers/sizes-pr.txt | tee sizediff.txt
      - name: Create comment
        if: steps.diff.outcome == 'success'
        run: |
          echo "Size difference with the dev branch:" > comment.txt
          echo "<details><summary>Binary size difference</summary>" >> comment.txt
          echo "<pre>" >> comment.txt
          cat sizediff.txt >> comment.txt
          echo "</pre></details>" >> comment.txt
      - name: Comment contents
        if: steps.diff.outcome == 'success'
        run: cat comment.txt
      - name: Add comment
        if: ${{ steps.diff.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        uses: thollander/actions-comment-pull-request@v2.3.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          filePath: comment.txt
          comment_tag: sizediff
